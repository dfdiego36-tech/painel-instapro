    function mapUrls(point, detail=true) {
      const {lat,lon}=point;
      const deltaLat=detail ? 0.004 : 0.14;
      const deltaLon=detail ? 0.007 : 0.23;
      const box=[Math.max(-180,lon-deltaLon),Math.max(-85,lat-deltaLat),Math.min(180,lon+deltaLon),Math.min(85,lat+deltaLat)].map(n=>n.toFixed(5)).join(',');
      const query=new URLSearchParams({bbox:box,layer:'mapnik',marker:`${lat},${lon}`});
      return {embed:`https://www.openstreetmap.org/export/embed.html?${query}`,full:`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=${detail?16:11}/${lat}/${lon}`};
    }
    function cityKey(name) {
      return String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
    }

    function locationPoints(city) {

    async function cityJson(url, signal) {
      const response=await fetch(url,{signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});
      if(!response.ok)throw Error('No se pudo consultar la ciudad.');
      return response.json();
    }
    async function findPublicCity(location, signal) {
      const {city,country_code,region}=location;
      if(typeof city!=='string'||city.trim().length<2||city.length>100)throw Error('El servicio no devolvió ninguna ciudad.');
      const key=cityKey(city);
      if(country_code==='BR'){
        const known=mapCities.find(item=>cityKey(item.name)===key);
        if(known)return known;
      }
      const query=new URLSearchParams({name:city,count:'12',language:'en'});
      if(/^[A-Z]{2}$/.test(country_code))query.set('countryCode',country_code);
      const payload=await cityJson(`https://geocoding-api.open-meteo.com/v1/search?${query}`,signal);
      const matches=(payload.results||[]).filter(item=>cityKey(item.name)===key&&Number.isFinite(item.latitude)&&Math.abs(item.latitude)<85&&Number.isFinite(item.longitude)&&Math.abs(item.longitude)<=180);
      const matchedRegion=region&&matches.find(item=>cityKey(item.admin1)===cityKey(region));
      const place=matchedRegion||(matches.length===1?matches[0]:null);
      if(!place)throw Error('No se pudo identificar el centro de la ciudad.');
      return {name:place.name,lat:Number(place.latitude.toFixed(4)),lon:Number(place.longitude.toFixed(4))};
    }

      button.disabled=true;
      status.textContent='Buscando la ciudad aproximada…';
      const deadline=setTimeout(()=>lookup.abort(),8500);
      try {
        const info=await cityJson('https://get.geojs.io/v1/ip/geo.json',lookup.signal);
        const city=await findPublicCity(info,lookup.signal);
        if(cityLookup!==lookup)return;
        state.locationMap.city={...city,source:'conexao'};
        cityLookup=null;
        save();render();
        document.querySelector('#city-status').textContent=`Mapa centrado en ${city.name}.`;

        cityLookup=null;
        const control=document.querySelector('[data-action="map-detect"]');
        if(control)control.disabled=false;
        const feedback=document.querySelector('#city-status');
        if(feedback)feedback.textContent='No se pudo detectar la ciudad. Elige una opción de la lista.';
      } finally {
        clearTimeout(deadline);
      }

    function detectiveChatMoment(elapsed) {

      const message=detectiveMessages[next];
      const isTyping=elapsed>=message.typingAt;
      return {count:next,typing:isTyping?message.side:null,finished:false,nextAt:isTyping?message.at:message.typingAt};

    function updateDetectiveChat() {

      const moment=detectiveChatMoment(elapsed);
      phone.querySelector('.det-play').hidden=true;
      phone.querySelectorAll('[data-chat-message]').forEach((bubble,index)=>{bubble.hidden=index>=moment.count;});
      const typing=phone.querySelector('#det-typing');
      typing.classList.toggle('outgoing',moment.typing==='outgoing');
      typing.hidden=!moment.typing;
      phone.querySelector('#det-chat-result').hidden=!moment.finished;
      const chat=phone.querySelector('#det-chat');

      if(moment.nextAt!==null)chatTimer=setTimeout(updateDetectiveChat,Math.max(1,moment.nextAt-elapsed));

    async function derivePassword(password,salt,iterations) {
      if(!globalThis.crypto?.subtle)throw Error('Abre el archivo en un navegador compatible con el cifrado local.');
      const input=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
      const result=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(salt),iterations},input,256);
      return Array.from(new Uint8Array(result),byte=>byte.toString(16).padStart(2,'0')).join('');
    }
    async function createLocalAccount(name,email,password) {
      if(!name.trim())throw Error('Introduce tu nombre completo.');
      if(password.length<8||password.length>128)throw Error('Usa entre 8 y 128 caracteres en la contraseña.');
      if(readAccounts().some(entry=>entry.email===email))throw Error('Ya existe una cuenta con ese correo electrónico.');
      if(!globalThis.crypto?.subtle)throw Error('Abre el archivo en un navegador compatible con el cifrado local.');
      const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));
      const verifier=await derivePassword(password,salt,passwordRounds);
      // Re-read after deriving the verifier in case another tab saved a registration.
      const accounts=readAccounts();
      if(accounts.some(entry=>entry.email===email))throw Error('Ya existe una cuenta con ese correo electrónico.');
      const entry={name:name.trim(),email,salt,verifier,iterations:passwordRounds,startingCredits:signupCredits,welcomePending:true};
      accounts.push(entry);
      localStorage.setItem(accountsKey,JSON.stringify(accounts));
      return entry;
    }
    async function verifyLocalAccount(email,password) {
      const entry=readAccounts().find(candidate=>candidate.email===email);
      if(!entry||await derivePassword(password,entry.salt,entry.iterations)!==entry.verifier)throw Error('Correo electrónico o contraseña incorrectos.');
      return entry;
    }

    async function submitLocalAuth(form) {
      const button=form.querySelector('.auth-submit');
      if(button.disabled)return;
      const feedback=form.querySelector('.auth-feedback');
      const email=normalizeEmail(form.querySelector('#auth-email').value);
      const password=form.querySelector('#auth-password');
      const confirmEmail=form.querySelector('#auth-confirm-email');
      feedback.hidden=true;
      feedback.classList.remove('error');
      button.disabled=true;
      form.setAttribute('aria-busy','true');
      try {
        if(confirmEmail){
          if(normalizeEmail(confirmEmail.value)!==email){
            confirmEmail.focus();
            throw Error('Los correos electrónicos deben coincidir.');
          }
          const entry=await createLocalAccount(form.querySelector('#auth-name').value,email,password.value);
          if(form.isConnected)openAccount(entry);
        } else {
          const entry=await verifyLocalAccount(email,password.value);
          if(form.isConnected)openAccount(entry);
        }
      } catch(error) {
        feedback.textContent=error instanceof Error&&error.name==='Error'?error.message:'El navegador no pudo guardar o consultar los datos locales.';
        feedback.classList.add('error');
        feedback.hidden=false;
      } finally {
        password.value='';
        const eye=form.querySelector('.auth-eye');
        if(eye.getAttribute('aria-pressed')==='true')toggleAuthPassword(eye);
        button.disabled=false;
        form.removeAttribute('aria-busy');
      }
    }

          break;
        }
        case 'reset': modal('Restaurar panel','<p>¿Quieres restaurar el saldo y la XP iniciales y borrar las investigaciones?</p>','Restaurar',()=>{stopCityLookup();state=initial();save();go('painel');notify('Panel restaurado.');},'btn danger');break;
        case 'signout': modal('Cerrar sesión','<p>¿Quieres volver a la pantalla de inicio de sesión?</p>','Cerrar sesión',closeAccount);break;
        case 'auth-password': toggleAuthPassword(button);break;
        case 'finish-welcome': finishWelcome();break;
        case 'policy': policy(id);break;
        case 'support': modal('Contactar con soporte','<p>Consulta las respuestas en el Centro de ayuda.</p>');break;
      }
    }
    function normalizeIdentifier(id, input) {
      if(!input)return null;
      const raw=input.trim();
      if(trackers[id].field==='phone'){
        const number=raw.replace(/[\s().-]/g,'');
        return /^\+?\d{7,15}$/.test(number)?raw.replace(/\s+/g,' '):null;
      }
      if(id==='facebook'){
        const url=raw.match(/^(?:https?:\/\/)?(?:(?:www|m)\.)?(?:facebook\.com|fb\.com)\/([a-z\d_.]{1,80})\/?(?:[?#].*)?$/i);
        if(url)return `@${url[1]}`;
      }
      const name=raw.replace(/^@/,'');
      return /^[a-zA-Z0-9_.]{1,30}$/.test(name)?`@${name}`:null;
    }
    function startAnalysis(id, input) {
      if(analysisProgress(id)!==null)return false;
      const spec=trackers[id];
      const service=services.find(item=>item.id===id);
      const identifier=normalizeIdentifier(id,input);
      if((id==='instagram'||spec.field)&&!identifier)return false;
      const cost=state.orders[id]==='ready'?0:serviceCost(service);
      const xp=id==='localizacao'?30:10;
      const start=()=>{
        state.analyses[id]={handle:identifier||'',startedAt:Date.now(),boost:0};
        if(id==='localizacao')state.locationMap=emptyLocationMap();
        delete state.orders[id];
        if(cost)gainXp(xp);
        save();render();
        if(cost)notify(`💸 Créditos gastados\n${state.unlimited?'Saldo ilimitado':`−${formatNumber.format(cost)} créditos`} | +${xp} XP`,'spend');
      };
      if(cost)confirmCredit(cost,service.name,start);
      else start();
      return true;
    }
    document.addEventListener('input',event=>{
      if(event.target.matches('.auth-form input'))event.target.setCustomValidity('');
      const form=event.target.closest('form[data-analysis]');
      if(!form)return;
      const valid=!!normalizeIdentifier(form.dataset.analysis,event.target.value);
      form.querySelector('[type="submit"]').disabled=!valid;
      if(valid){event.target.removeAttribute('aria-invalid');form.querySelector('#handle-error').hidden=true;}
    });
    document.addEventListener('invalid',event=>{
      const input=event.target;
      if(!input.matches('.auth-form input'))return;
      if(input.validity.valueMissing)input.setCustomValidity('Completa este campo.');
      else if(input.validity.typeMismatch)input.setCustomValidity('Introduce un correo electrónico válido.');
      else if(input.validity.tooShort)input.setCustomValidity('Usa al menos 8 caracteres en la contraseña.');
    },true);
    document.addEventListener('change',event=>{
      if(event.target.id!=='map-city'||event.target.value==='')return;
      const city=mapCities[Number(event.target.value)];
      if(!city)return;
      stopCityLookup();
      state.locationMap.city={...city,source:'manual'};
      save();render();
      document.querySelector('#map-city').focus();
    });
    document.addEventListener('submit',event=>{
      const refund=event.target.closest('form[data-refund-form]');
      if(refund){
        event.preventDefault();
        const empty=[refund.elements.fullName,refund.elements.reason].find(field=>!field.value.trim());
        if(empty){
          refund.querySelector('[role="alert"]').hidden=false;
          empty.focus();
          return;
        }
        showRefundConfirmation();
        return;
      }
      const auth=event.target.closest('form[data-auth-form]');
      if(auth){event.preventDefault();void submitLocalAuth(auth);return;}
      const form=event.target.closest('form[data-analysis]');
      if (!form) return;
      event.preventDefault();
      const input=form.querySelector('input');
      if(startAnalysis(form.dataset.analysis,input?.value||'')||!input)return;
      const error=form.querySelector('#handle-error');
      error.textContent=input.type==='tel'?'Introduce un número de teléfono válido.':'Revisa los datos del perfil.';
      error.hidden=false;
      input.setAttribute('aria-invalid','true');
      input.focus();
    });
    document.addEventListener('click',event=>{
      const control=event.target.closest('[data-action]');
      if(control){const [type,id]=control.dataset.action.split(':');handleAction(type,id,control);return;}
      if(event.target===dialog)dialog.close();
      const menu=document.querySelector('#menu');
      if(menu&&!menu.hidden&&!menu.contains(event.target)){menu.hidden=true;document.querySelector('[data-action="menu"]').setAttribute('aria-expanded','false');}
    });
    document.addEventListener('keydown',event=>{
      if(event.key!=='Escape')return;
      const menu=document.querySelector('#menu');
      if(menu&&!menu.hidden){menu.hidden=true;const button=document.querySelector('[data-action="menu"]');button.setAttribute('aria-expanded','false');button.focus();}
    });
    window.addEventListener('hashchange',()=>{stopCityLookup();stopDetectiveChat();if(dialog.open)dialog.close();render();window.scrollTo(0,0);});

    const matrix=document.querySelector('#matrix');
    for(let i=0;i<130;i++){
      const char=document.createElement('span');
      char.textContent='01ABCDFKMNQX245789'[i%18];
      char.style.left=`${(i*137.53)%100}%`;
      char.style.top=`${(i*42.72)%100}%`;
      matrix.append(char);
    }
    const authMatrix=document.querySelector('#auth-matrix');
    const matrixLetters='INSTAPROINSTAPRO';
    for(let column=0;column<85;column++){
      const stream=document.createElement('span');
      stream.textContent=Array.from({length:160},(_,row)=>matrixLetters[(row*7+column*11+row%5)%matrixLetters.length]).join('\n');
      stream.style.cssText=`--left:${column*1.2}%;--top:${-(column*43%470)}px;--opacity:${column%7===3?.28:column%4===1?.13:.06}`;
      authMatrix.append(stream);
    }
    render();
    setInterval(refreshProgress,1000);
  </script>
</body>
</html>
